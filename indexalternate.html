<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cozy Globe 3D - Zen Nature</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        .ui-overlay { pointer-events: none; }
        .interactive { pointer-events: auto; }
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 3px solid #fcd34d;
            box-shadow: 0 4px 0 #d97706;
        }
        #weather-info { text-transform: capitalize; }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        .fade-in { animation: fade-in 0.5s ease-out; }
    </style>
</head>
<body>

    <!-- HUD -->
    <div class="fixed inset-0 ui-overlay flex flex-col p-6 select-none fade-in">
        <div class="flex justify-between items-start mb-4">
            <div class="flex flex-col space-y-2">
                <div class="glass p-3 rounded-2xl flex items-center space-x-2 interactive">
                    <span class="text-2xl">💰</span>
                    <span id="bells-display" class="font-bold text-amber-900 text-xl">0</span>
                </div>
                <div class="glass p-2 px-4 rounded-xl text-amber-900 text-sm font-bold interactive">
                    <span id="weather-info">☀️ Clear</span>
                </div>
            </div>
            
            <div class="glass p-3 rounded-2xl text-amber-900 font-bold interactive text-right">
                <div id="clock">12:00 PM</div>
                <div class="text-[10px] opacity-50">ISLAND TIME</div>
            </div>
        </div>

        <div class="absolute right-4 top-1/2 -translate-y-1/2 flex flex-col space-y-2">
            <div id="inventory-bar" class="glass p-2 rounded-3xl flex flex-col space-y-2 interactive">
                <!-- Slots generated by JS -->
            </div>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div class="fixed bottom-0 left-0 right-0 h-1/3 ui-overlay flex items-center justify-center pb-12">
        <div id="joystick-zone" class="w-32 h-32 bg-white/10 rounded-full border-2 border-white/20 relative interactive">
            <div id="joystick-knob" class="w-12 h-12 bg-white/40 rounded-full absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 shadow-lg transition-transform duration-75"></div>
        </div>
    </div>

    <!-- Shop Modal -->
    <div id="shop-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-6 z-50">
        <div class="glass max-w-xs w-full rounded-3xl p-6 pointer-events-auto">
            <h2 class="text-2xl font-black text-amber-900 mb-2">Nook's Globe Shop</h2>
            <p class="text-amber-800 text-sm mb-4">Trade your treasures for Bells?</p>
            <div id="shop-items" class="space-y-2 max-h-48 overflow-y-auto mb-4"></div>
            <div class="flex space-x-2">
                <button id="sell-all-btn" class="flex-1 py-3 bg-green-500 text-white font-bold rounded-xl shadow-lg active:translate-y-1">Sell All</button>
                <button id="close-shop-btn" class="px-4 py-3 bg-gray-200 text-gray-700 font-bold rounded-xl">Exit</button>
            </div>
        </div>
    </div>

    <script>
        // --- Sound Engine ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration, vol = 0.1) {
            if (audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const SFX = {
            gather: () => { playTone(440, 'sine', 0.2); setTimeout(() => playTone(660, 'sine', 0.2), 50); },
            coin: () => { playTone(880, 'sine', 0.1, 0.08); setTimeout(() => playTone(1108.73, 'sine', 0.15, 0.08), 60); },
            sell: () => { playTone(523.25, 'triangle', 0.5); setTimeout(() => playTone(659.25, 'triangle', 0.5), 100); },
            click: () => playTone(300, 'sine', 0.1, 0.05),
            weather: () => playTone(200, 'sine', 1, 0.05)
        };

        // --- Configuration ---
        const GLOBE_RADIUS = 50;
        const DAY_LENGTH = 480; 
        const SPAWN_MARGIN = 8.0; 
        const PLAYER_SAFETY_ZONE = 22.0; 
        const ITEM_TYPES = {
            APPLE: { name: 'Apple', emoji: '🍎', value: 100, color: 0xff4444 },
            ORANGE: { name: 'Orange', emoji: '🍊', value: 100, color: 0xffa500 },
            FLOWER: { name: 'Flower', emoji: '🌸', value: 40, color: 0xff69b4 },
            BUSH: { name: 'Berry', emoji: '🫐', value: 60, color: 0x4c1d95 },
            BUTTERFLY: { name: 'Butterfly', emoji: '🦋', value: 250, color: 0x4fd1c5 },
            LADYBUG: { name: 'Ladybug', emoji: '🐞', value: 150, color: 0xef4444 },
            FIREFLY: { name: 'Firefly', emoji: '✨', value: 300, color: 0xeaff00 },
            FISH: { name: 'Fish', emoji: '🐟', value: 200, color: 0x3b82f6 },
            BIRD: { name: 'Feather', emoji: '🪶', value: 50, color: 0xffffff },
            PENGUIN: { name: 'Penguin', emoji: '🐧', value: 400, color: 0x111111 },
            POLARBEAR: { name: 'Polar Bear', emoji: '🐻‍❄️', value: 600, color: 0xffffff },
            CAMEL: { name: 'Camel', emoji: '🐪', value: 500, color: 0xc2b280 },
            ZEBRA: { name: 'Zebra', emoji: '🦓', value: 600, color: 0xffffff },
            GIRAFFE: { name: 'Giraffe', emoji: '🦒', value: 700, color: 0xffa500 },
            ELEPHANT: { name: 'Elephant', emoji: '🐘', value: 800, color: 0x808080 },
            REDPANDA: { name: 'Red Panda', emoji: '🦊', value: 900, color: 0xf97316 },
            FOX: { name: 'Arctic Fox', emoji: '❄️', value: 550, color: 0xe5e7eb },
            OSTRICH: { name: 'Ostrich', emoji: '🐦', value: 450, color: 0x4b5563 },
            CRAB: { name: 'Crab', emoji: '🦀', value: 180, color: 0xef4444 },
            COIN: { name: 'Coin', emoji: '💰', value: 50, color: 0xffd700 }
        };

        const BIOMES = {
            GRASSLAND: { ground: 0x7cfc00, items: ['tree', 'flower', 'butterfly', 'ladybug', 'bush', 'redpanda'] },
            DESERT: { ground: 0xedc9af, items: ['cactus', 'camel'] },
            SNOW: { ground: 0xffffff, items: ['penguin', 'polarbear', 'fox'] },
            SAFARI: { ground: 0x96ad55, items: ['zebra', 'giraffe', 'elephant', 'ostrich'] }
        };

        let scene, camera, renderer, globe, player, clock;
        let sun, moon, sunOrbit, stars, rainbow, shootingStar, lensFlare;
        let entities = [];
        let joystick = { active: false, dx: 0, dy: 0 };
        let state = { 
            bells: 0, 
            inventory: [], 
            time: 0, 
            weather: 'clear', 
            targetWeather: 'clear',
            weatherIntensity: 0,
            skyMode: 'default',
            moonPhase: 0,
            playerPhi: Math.PI / 2,
            playerTheta: 0
        };
        
        let weatherParticles, skyTexture, skyCanvas, skyCtx;

        function init() {
            scene = new THREE.Scene();
            skyCanvas = document.createElement('canvas');
            skyCanvas.width = 128; skyCanvas.height = 512;
            skyCtx = skyCanvas.getContext('2d');
            skyTexture = new THREE.CanvasTexture(skyCanvas);
            scene.background = skyTexture;

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 14);
            camera.lookAt(0, 2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            sunOrbit = new THREE.Group();
            scene.add(sunOrbit);

            sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(0, GLOBE_RADIUS + 55, 0);
            sun.castShadow = true;
            sunOrbit.add(sun);

            const sunSphere = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffdd00 }));
            sunSphere.position.copy(sun.position);
            sunOrbit.add(sunSphere);

            moon = new THREE.Group();
            const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 16), new THREE.MeshBasicMaterial({ color: 0xeeeeee }));
            moon.add(moonMesh);
            moon.position.set(0, -(GLOBE_RADIUS + 55), 0);
            sunOrbit.add(moon);
            moon.mesh = moonMesh;

            const flareCanvas = document.createElement('canvas');
            flareCanvas.width = 64; flareCanvas.height = 64;
            const flareCtx = flareCanvas.getContext('2d');
            const flareGrad = flareCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
            flareGrad.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
            flareGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            flareCtx.fillStyle = flareGrad; flareCtx.fillRect(0,0,64,64);
            lensFlare = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(flareCanvas), blending: THREE.AdditiveBlending, transparent: true }));
            lensFlare.scale.set(12, 12, 1);
            scene.add(lensFlare);

            const rainbowGeo = new THREE.TorusGeometry(38, 0.8, 8, 48, Math.PI);
            const rainbowMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, vertexColors: true });
            const colors = [];
            for(let i=0; i<rainbowGeo.attributes.position.count; i++) {
                const c = new THREE.Color().setHSL(i/rainbowGeo.attributes.position.count, 0.8, 0.5);
                colors.push(c.r, c.g, c.b);
            }
            rainbowGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            rainbow = new THREE.Mesh(rainbowGeo, rainbowMat);
            rainbow.position.set(0, -10, -40);
            scene.add(rainbow);

            // Shooting Star
            const shootGeo = new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute([0,0,0,2,2,-5], 3));
            shootingStar = new THREE.Line(shootGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 }));
            scene.add(shootingStar);

            createStars();
            createWeatherSystems();
            createGlobe();
            createPlayer();
            setupControls();
            updateInventoryUI();

            clock = new THREE.Clock();
            animate();
            
            setInterval(changeWeather, 60000); 
            setInterval(rollSkyMode, 120000);
            document.getElementById('sell-all-btn').onclick = sellAll;
            document.getElementById('close-shop-btn').onclick = closeShop;
        }

        function rollSkyMode() {
            const roll = Math.random();
            if (roll < 0.1) state.skyMode = 'rare-pink';
            else if (roll < 0.2) state.skyMode = 'rare-purple';
            else state.skyMode = 'default';
        }

        function createStars() {
            const starGeo = new THREE.BufferGeometry();
            const starPos = [];
            for(let i=0; i<1500; i++) starPos.push((Math.random()-0.5)*800, (Math.random()-0.5)*800, (Math.random()-0.5)*800);
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
            stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 }));
            scene.add(stars);
        }

        function createWeatherSystems() {
            const rainGeo = new THREE.BufferGeometry();
            const rainPos = [];
            for(let i=0; i<800; i++) rainPos.push((Math.random()-0.5)*60, Math.random()*30, (Math.random()-0.5)*60);
            rainGeo.setAttribute('position', new THREE.Float32BufferAttribute(rainPos, 3));
            const rainMat = new THREE.PointsMaterial({ color: 0xaaaaFF, size: 0.1, transparent: true, opacity: 0 });
            weatherParticles = new THREE.Points(rainGeo, rainMat);
            scene.add(weatherParticles);
        }

        function createGlobe() {
            const geometry = new THREE.SphereGeometry(GLOBE_RADIUS, 64, 64);
            const material = new THREE.MeshStandardMaterial({ color: 0x7cfc00 });
            globe = new THREE.Mesh(geometry, material);
            globe.receiveShadow = true;
            globe.position.y = -GLOBE_RADIUS;
            scene.add(globe);

            for(let i=0; i<200; i++) spawnProceduralEntity(null, null, true);
        }

        function createPlayer() {
            player = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1, 12), new THREE.MeshStandardMaterial({ color: 0xf87171 }));
            body.position.y = 0.5; body.castShadow = true; player.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffedd5 }));
            head.position.y = 1.2; player.add(head);
            scene.add(player);
        }

        function getBiomeAt(phi, theta) {
            const slice = (theta + Math.PI) / (Math.PI * 2);
            if (slice < 0.15) return 'SAFARI';
            if (slice < 0.35) return 'SNOW';
            if (slice < 0.6) return 'GRASSLAND';
            if (slice < 0.85) return 'DESERT';
            return 'GRASSLAND';
        }

        function isWaterAt(phi, theta) {
            const targetTheta = Math.sin(phi * 3) * 0.4 + 1.2;
            return Math.abs(theta - targetTheta) < 0.25;
        }

        function isPositionOccupied(newPos, checkEntities, type, phi, theta) {
            const playerCenter = new THREE.Vector3(0, GLOBE_RADIUS, 0);
            const safetyZone = (type === 'house' || type === 'shop' || type === 'bridge') ? 45 : PLAYER_SAFETY_ZONE;
            if (newPos.distanceTo(playerCenter) < safetyZone) return true;
            if (isWaterAt(phi, theta) && !['bridge', 'fish', 'crab'].includes(type)) return true;
            for (let ent of checkEntities) {
                if (['cloud', 'bird'].includes(ent.type)) continue; 
                const entPos = new THREE.Vector3(); ent.mesh.getWorldPosition(entPos);
                if (newPos.distanceTo(entPos) < SPAWN_MARGIN) return true;
            }
            return false;
        }

        function spawnProceduralEntity(lat = null, lon = null, isInitial = false) {
            let phi = lat !== null ? lat : Math.random() * Math.PI;
            let theta = lon !== null ? lon : (Math.random() * Math.PI * 2 - Math.PI);
            const biomeKey = getBiomeAt(phi, theta);
            const inWater = isWaterAt(phi, theta);
            const typeRoll = Math.random();
            let type = 'tree';

            if (inWater) {
                if (typeRoll < 0.1) type = 'bridge';
                else if (typeRoll < 0.3) type = 'fish';
                else if (typeRoll < 0.5) type = 'crab';
                else return;
            } else {
                if (typeRoll < 0.12) type = 'cloud';
                else if (typeRoll < 0.16) type = 'bird';
                else if (typeRoll < 0.20) type = 'house';
                else if (typeRoll < 0.22) type = 'shop';
                else if (typeRoll < 0.27) type = 'coin'; 
                else {
                    if (biomeKey === 'SNOW') {
                        if (typeRoll < 0.4) type = 'penguin';
                        else if (typeRoll < 0.6) type = 'polarbear';
                        else type = 'fox';
                    } else if (biomeKey === 'DESERT') {
                        if (typeRoll < 0.6) type = 'cactus';
                        else type = 'camel';
                    } else if (biomeKey === 'SAFARI') {
                        if (typeRoll < 0.3) type = 'zebra';
                        else if (typeRoll < 0.5) type = 'giraffe';
                        else if (typeRoll < 0.7) type = 'elephant';
                        else type = 'ostrich';
                    } else {
                        if (typeRoll < 0.4) type = 'tree';
                        else if (typeRoll < 0.6) type = 'flower';
                        else if (typeRoll < 0.7) type = 'butterfly';
                        else if (typeRoll < 0.8) type = 'ladybug';
                        else if (typeRoll < 0.9) type = 'redpanda';
                        else type = 'bush';
                    }
                }
            }

            let pos = new THREE.Vector3().setFromSphericalCoords(GLOBE_RADIUS, phi, theta);
            if (isPositionOccupied(pos, entities, type, phi, theta) && !isInitial) return;

            const entity = { type, phi, theta, id: Math.random(), offset: Math.random() * 10, drift: (Math.random()*0.05+0.02) };
            const group = new THREE.Group();

            if (type === 'tree') {
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 2), new THREE.MeshStandardMaterial({ color: 0x5d4037 }));
                trunk.position.y = 1; group.add(trunk);
                const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.3, 8, 8), new THREE.MeshStandardMaterial({ color: 0x2e7d32 }));
                leaves.position.y = 2.5; group.add(leaves);
            } else if (type === 'coin') {
                const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.1, 16), new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 }));
                coin.rotation.x = Math.PI/2; coin.position.y = 0.6; group.add(coin); entity.coinMesh = coin;
            } else if (type === 'redpanda') {
                const b = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.8), new THREE.MeshStandardMaterial({ color: 0xf97316 }));
                b.position.y = 0.2;
                const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.7), new THREE.MeshStandardMaterial({ color: 0x7c2d12 }));
                tail.position.set(0, 0.1, -0.6); tail.rotation.x = -Math.PI/4; b.add(tail);
                group.add(b); entity.animalGroup = b;
            } else if (type === 'fox') {
                const b = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.7), new THREE.MeshStandardMaterial({ color: 0xe5e7eb }));
                b.position.y = 0.2; group.add(b); entity.animalGroup = b; entity.state = 'idle'; entity.stateTime = 0;
            } else if (type === 'ostrich') {
                const b = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshStandardMaterial({ color: 0x4b5563 }));
                b.position.y = 1.2;
                const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.1, 1), new THREE.MeshStandardMaterial({ color: 0xfecaca }));
                neck.position.set(0, 0.6, 0.3); b.add(neck);
                group.add(b); entity.animalGroup = b;
            } else if (type === 'crab') {
                const b = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.4), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
                b.position.y = 0.1; group.add(b); entity.animalGroup = b;
            } else if (['zebra', 'penguin', 'polarbear', 'elephant', 'camel', 'giraffe', 'ladybug', 'butterfly'].includes(type)) {
                const col = ITEM_TYPES[type.toUpperCase()] ? ITEM_TYPES[type.toUpperCase()].color : 0xffffff;
                const b = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 1), new THREE.MeshStandardMaterial({ color: col }));
                b.position.y = 0.3; group.add(b); entity.animalGroup = b;
            } else if (type === 'bush') {
                const bGroup = new THREE.Group();
                for(let i=0; i<5; i++) {
                    const b = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshStandardMaterial({ color: 0x166534 }));
                    b.position.set((Math.random()-0.5)*1, 0.4, (Math.random()-0.5)*1);
                    bGroup.add(b);
                }
                group.add(bGroup);
            } else if (type === 'cactus') {
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.8, 8), new THREE.MeshStandardMaterial({ color: 0x2d5a27 }));
                trunk.position.y = 0.9; group.add(trunk);
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), new THREE.MeshStandardMaterial({ color: 0x2d5a27 }));
                head.position.y = 1.8; group.add(head);
            } else if (type === 'house' || type === 'shop') {
                const base = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2, 2.5), new THREE.MeshStandardMaterial({ color: type === 'shop' ? 0xd97706 : 0xfae8ff }));
                base.position.y = 1; group.add(base);
                const roof = new THREE.Mesh(new THREE.ConeGeometry(2.2, 1.8, 4), new THREE.MeshStandardMaterial({ color: 0x92400e }));
                roof.position.y = 2.8; roof.rotation.y = Math.PI/4; group.add(roof);
            } else if (type === 'bridge') {
                const bridge = new THREE.Mesh(new THREE.BoxGeometry(3, 0.4, 8), new THREE.MeshStandardMaterial({ color: 0x5d4037 }));
                bridge.position.y = 0.2; group.add(bridge);
            } else if (type === 'cloud') {
                const cGroup = new THREE.Group();
                for(let i=0; i<5; i++) {
                    const c = new THREE.Mesh(new THREE.SphereGeometry(6, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 }));
                    c.position.set((Math.random()-0.5)*12, (Math.random()-0.5)*3, (Math.random()-0.5)*12);
                    cGroup.add(c);
                }
                cGroup.position.y = 30; group.add(cGroup);
            } else if (type === 'bird') {
                const wingL = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 0.3), new THREE.MeshStandardMaterial({ color: 0x333333 }));
                const wingR = wingL.clone(); wingL.position.x = -0.4; wingR.position.x = 0.4;
                const bGroup = new THREE.Group(); bGroup.add(wingL, wingR);
                bGroup.position.y = 15; group.add(bGroup); entity.wingL = wingL; entity.wingR = wingR; entity.bGroup = bGroup;
            }

            const altitude = (type === 'cloud') ? GLOBE_RADIUS + 30 : (type === 'bird' ? GLOBE_RADIUS + 15 : GLOBE_RADIUS);
            group.position.copy(new THREE.Vector3().setFromSphericalCoords(altitude, phi, theta));
            const normal = group.position.clone().normalize();
            group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);

            globe.add(group);
            entity.mesh = group;
            entities.push(entity);
        }

        function setupControls() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            const updateJoystick = (e) => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const touch = e.touches ? e.touches[0] : e;
                const rect = zone.getBoundingClientRect();
                const center = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
                let dx = touch.clientX - center.x;
                let dy = touch.clientY - center.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const max = rect.width / 2;
                if (dist > max) { dx *= max/dist; dy *= max/dist; }
                joystick.dx = dx/max; joystick.dy = dy/max;
                knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            };
            zone.addEventListener('pointerdown', (e) => { joystick.active = true; updateJoystick(e); });
            window.addEventListener('pointermove', (e) => { if(joystick.active) updateJoystick(e); });
            window.addEventListener('pointerup', () => { joystick.active = false; joystick.dx = 0; joystick.dy = 0; knob.style.transform = `translate(-50%, -50%)`; });
        }

        function changeWeather() {
            const rolls = ['clear', 'rain', 'snow', 'storm'];
            state.targetWeather = rolls[Math.floor(Math.random() * rolls.length)];
            const icons = { clear: '☀️ Clear', rain: '🌧️ Rain', snow: '❄️ Snow', storm: '⛈️ Storm' };
            const el = document.getElementById('weather-info');
            if (el) el.innerText = icons[state.targetWeather];
            SFX.weather();
        }

        const skyColors = { top: new THREE.Color(0x87ceeb), bottom: new THREE.Color(0xe0f2fe) };

        function updateAtmosphere(delta) {
            state.time += delta;
            const cycleProgress = (state.time % DAY_LENGTH) / DAY_LENGTH;
            sunOrbit.rotation.z = cycleProgress * Math.PI * 2 + Math.PI;

            if (state.weather !== state.targetWeather) {
                state.weatherIntensity -= delta * 0.05;
                if (state.weatherIntensity <= 0) { state.weatherIntensity = 0; state.weather = state.targetWeather; }
            } else {
                state.weatherIntensity = THREE.MathUtils.lerp(state.weatherIntensity, 1, delta * 0.05);
            }

            let tTop, tBottom;
            const isNight = cycleProgress < 0.25 || cycleProgress > 0.75;
            if (isNight) { tTop = new THREE.Color(0x0f172a); tBottom = new THREE.Color(0x1e293b); stars.visible = true; sun.intensity = 0.1; }
            else if (cycleProgress < 0.35 || cycleProgress > 0.65) { 
                if (state.skyMode === 'rare-pink') { tTop = new THREE.Color(0xf43f5e); tBottom = new THREE.Color(0xfb923c); }
                else if (state.skyMode === 'rare-purple') { tTop = new THREE.Color(0x8b5cf6); tBottom = new THREE.Color(0xf97316); }
                else { tTop = new THREE.Color(0xf6ad55); tBottom = new THREE.Color(0xed8936); }
                stars.visible = false; sun.intensity = 0.4; 
            } else { tTop = new THREE.Color(0x87ceeb); tBottom = new THREE.Color(0xe0f2fe); stars.visible = false; sun.intensity = 1.0; }
            
            if (state.weather === 'storm' || state.weather === 'rain') {
                const stormCol = new THREE.Color(0x4a5568);
                tTop.lerp(stormCol, state.weatherIntensity * 0.5);
                tBottom.lerp(stormCol, state.weatherIntensity * 0.3);
            }
            
            skyColors.top.lerp(tTop, 0.01); skyColors.bottom.lerp(tBottom, 0.01);
            const grad = skyCtx.createLinearGradient(0, 0, 0, skyCanvas.height);
            grad.addColorStop(0, `#${skyColors.top.getHexString()}`);
            grad.addColorStop(1, `#${skyColors.bottom.getHexString()}`);
            skyCtx.fillStyle = grad; skyCtx.fillRect(0, 0, skyCanvas.width, skyCanvas.height);
            skyTexture.needsUpdate = true;

            const currentBiome = getBiomeAt(Math.PI/2, state.playerTheta);
            globe.material.color.lerp(new THREE.Color(BIOMES[currentBiome].ground), 0.015);

            const sunPos = new THREE.Vector3(); sunOrbit.children[1].getWorldPosition(sunPos);
            const screenPos = sunPos.clone().project(camera);
            if (screenPos.z < 1 && Math.abs(screenPos.x) < 1.1 && Math.abs(screenPos.y) < 1.1) {
                lensFlare.position.copy(sunPos).multiplyScalar(0.9);
                lensFlare.material.opacity = THREE.MathUtils.lerp(lensFlare.material.opacity, 1.0, 0.05);
            } else lensFlare.material.opacity = THREE.MathUtils.lerp(lensFlare.material.opacity, 0, 0.05);

            moon.mesh.material.color.setHSL(0, 0, 0.9 - (state.moonPhase * 0.1));

            weatherParticles.material.opacity = state.weatherIntensity * 0.5;
            if (weatherParticles.visible) {
                const pos = weatherParticles.geometry.attributes.position.array;
                for(let i=1; i<pos.length; i+=3) {
                    pos[i] -= 5 * delta;
                    if(pos[i] < 0) pos[i] = 30;
                }
                weatherParticles.geometry.attributes.position.needsUpdate = true;
            }
        }

        function updateWildlife(delta) {
            const time = Date.now() * 0.001;
            entities.forEach(ent => {
                if (ent.collected) return;
                if (ent.type === 'coin' && ent.coinMesh) {
                    ent.coinMesh.rotateY(delta * 2);
                } else if (ent.type === 'bird') {
                    const flap = Math.sin(time * 12) * 0.5;
                    ent.wingL.rotation.z = flap; ent.wingR.rotation.z = -flap;
                    ent.bGroup.position.x = Math.sin(time * 0.5 + ent.offset) * 4;
                    ent.bGroup.position.z = Math.cos(time * 0.5 + ent.offset) * 4;
                } else if (ent.type === 'fox') {
                    // Pounce Logic
                    ent.stateTime += delta;
                    if (ent.state === 'idle' && ent.stateTime > 4) {
                        ent.state = 'jump'; ent.stateTime = 0;
                    }
                    if (ent.state === 'jump') {
                        const progress = ent.stateTime / 1.0; 
                        if (progress > 1) { ent.state = 'idle'; ent.stateTime = 0; ent.animalGroup.position.y = 0.2; ent.animalGroup.scale.y = 1; }
                        else {
                            ent.animalGroup.position.y = 0.2 + Math.sin(progress * Math.PI) * 1.5;
                            const squash = 1.0 + Math.sin(progress * Math.PI) * 0.4;
                            ent.animalGroup.scale.y = 1/squash;
                        }
                    }
                } else if (ent.type === 'crab') {
                    ent.animalGroup.position.x = Math.sin(time * 2 + ent.offset) * 1.0;
                } else if (ent.animalGroup) {
                    ent.animalGroup.rotation.y = Math.sin(time + ent.offset) * 0.1;
                    ent.animalGroup.position.y = Math.abs(Math.sin(time * 2 + ent.offset)) * 0.1 + 0.4;
                } else if (ent.type === 'firefly') {
                    ent.mesh.visible = (state.time % DAY_LENGTH) / DAY_LENGTH > 0.7 || (state.time % DAY_LENGTH) / DAY_LENGTH < 0.3;
                    if (ent.light) ent.light.intensity = ent.mesh.visible ? 1.0 : 0;
                } else if (ent.type === 'cloud') {
                    ent.mesh.rotateY(delta * ent.drift);
                }
            });
        }

        function checkCollisions() {
            const playerPos = new THREE.Vector3(0, GLOBE_RADIUS, 0); 
            let onBridge = false;
            entities.forEach(ent => {
                if (ent.collected || ent.type === 'cloud') return;
                const entityPos = new THREE.Vector3(); ent.mesh.getWorldPosition(entityPos);
                const dist = playerPos.distanceTo(entityPos);
                if (ent.type === 'bridge' && dist < 4.0) onBridge = true;
                if (dist < 2.5) {
                    if (ent.type === 'coin') {
                        if (dist < 2.2) {
                            state.bells += 50; document.getElementById('bells-display').innerText = state.bells;
                            ent.collected = true; ent.mesh.visible = false; SFX.coin();
                        }
                    } else {
                        const h = Object.keys(ITEM_TYPES).map(k => k.toLowerCase());
                        if (h.includes(ent.type) && dist < 2.2) collectItem(ITEM_TYPES[ent.type.toUpperCase().replace(' ','')], ent);
                        else if (['shop', 'house'].includes(ent.type)) openShop();
                    }
                }
            });
            return onBridge;
        }

        function collectItem(type, entity) {
            if (!type || type.name === 'Coin') return;
            const existing = state.inventory.find(i => i.name === type.name);
            if (existing) existing.count++; else state.inventory.push({ ...type, count: 1 });
            if (entity.type !== 'bridge') { entity.collected = true; entity.mesh.visible = false; }
            updateInventoryUI(); SFX.gather();
        }

        function updateInventoryUI() {
            const bar = document.getElementById('inventory-bar');
            if (!bar) return; bar.innerHTML = '';
            for(let i=0; i<8; i++) {
                const item = state.inventory[i];
                const slot = document.createElement('div');
                slot.className = 'w-12 h-12 border-2 border-amber-200 bg-amber-50 rounded-xl flex items-center justify-center relative text-xl shadow-inner';
                if (item) slot.innerHTML = `<span class="fade-in">${item.emoji}</span><span class="absolute -bottom-1 -right-1 bg-amber-600 text-white text-[10px] px-1 rounded-md font-bold">${item.count}</span>`;
                bar.appendChild(slot);
            }
            const display = document.getElementById('bells-display');
            if (display) display.innerText = state.bells;
        }

        function openShop() {
            const list = document.getElementById('shop-items');
            if (!list) return; list.innerHTML = '';
            state.inventory.forEach(item => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-white/50 p-2 rounded-lg border border-amber-100';
                div.innerHTML = `<span class="font-medium">${item.emoji} ${item.name} x${item.count}</span><span class="font-bold text-green-600">${item.value * item.count}💰</span>`;
                list.appendChild(div);
            });
            const modal = document.getElementById('shop-modal');
            if (modal && modal.classList.contains('hidden')) { modal.classList.remove('hidden'); modal.classList.add('flex'); SFX.click(); }
        }

        function closeShop() {
            const modal = document.getElementById('shop-modal');
            if (modal) { modal.classList.add('hidden'); modal.classList.remove('flex'); SFX.click(); }
        }

        function sellAll() {
            let total = 0;
            state.inventory.forEach(i => total += i.value * i.count);
            state.bells += total; state.inventory = [];
            updateInventoryUI(); closeShop();
            if (total > 0) SFX.sell();
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            if (joystick.dx !== 0 || joystick.dy !== 0) {
                const speed = 0.12 * delta; 
                const nextTheta = state.playerTheta + (joystick.dx * speed * 2.5);
                const nextPhi = state.playerPhi + (joystick.dy * speed * 2.5);
                const isBlocked = isWaterAt(nextPhi, nextTheta);
                const onBridge = checkCollisions();

                if (!isBlocked || onBridge) {
                    state.playerTheta = nextTheta;
                    state.playerPhi = nextPhi;
                    globe.rotation.set(0, 0, 0);
                    globe.rotateX(state.playerPhi - Math.PI / 2);
                    globe.rotateY(-state.playerTheta);
                }
                const targetRotation = Math.atan2(joystick.dx, joystick.dy);
                player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, targetRotation, 0.08);
                player.position.y = Math.abs(Math.sin(Date.now() * 0.005)) * 0.1;
            } else {
                player.position.y = THREE.MathUtils.lerp(player.position.y, 0, 0.1);
                checkCollisions();
            }
            if (Math.random() < 0.006) spawnProceduralEntity();
            updateAtmosphere(delta);
            updateWildlife(delta);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>

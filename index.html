                    document.querySelectorAll('[data-hat]').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    state.selectedAccessory = btn.dataset.hat;
                    updatePreview();
                });
            });

            // Carry item selection
            document.querySelectorAll('[data-carry]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (!state.unlockedAccessories.includes(btn.dataset.carry)) {
                        const cost = ACCESSORIES_CATALOG[btn.dataset.carry]?.cost || 0;
                        alert(`Unlock for ${cost} bells!`);
                        return;
                    }
                    document.querySelectorAll('[data-carry]').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    state.selectedCarry = btn.dataset.carry;
                    updatePreview();
                });
            });

            // Preview renderer setup
            const previewFrame = document.getElementById('preview-frame');
            let previewRenderer, previewScene, previewCamera, previewPlayer;
            
            function createPreview() {
                if (!previewFrame) return;
                previewFrame.innerHTML = '';
                previewRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                previewRenderer.setSize(192, 192);
                previewFrame.appendChild(previewRenderer.domElement);
                previewScene = new THREE.Scene();
                previewCamera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
                previewCamera.position.set(0, 1.5, 3);
                const light = new THREE.DirectionalLight(0xffffff, 1);
                light.position.set(5, 10, 7);
                previewScene.add(light);
                const amb = new THREE.AmbientLight(0xffffff, 0.4);
                previewScene.add(amb);
                previewPlayer = new THREE.Group();
                previewScene.add(previewPlayer);
                updatePreview();
                (function animatePreview(){
                    requestAnimationFrame(animatePreview);
                    if (previewPlayer) previewPlayer.rotation.y += 0.01;
                    previewRenderer.render(previewScene, previewCamera);
                })();
            }

            function updatePreview() {
                if (!previewPlayer) return;
                while(previewPlayer.children.length) previewPlayer.remove(previewPlayer.children[0]);
                
                // Build character from parts
                const buildCharacter = (target) => {
                    // Lower body (pants/dress/shorts)
                    const lowerGeo = new THREE.CylinderGeometry(0.3, 0.25, 0.8, 8);
                    const lowerMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
                    const lower = new THREE.Mesh(lowerGeo, lowerMat);
                    lower.position.y = 0.1;
                    target.add(lower);
                    
                    // Torso
                    const torsoGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.9, 8);
                    const torsoMat = new THREE.MeshStandardMaterial({ color: 0x3498db });
                    const torso = new THREE.Mesh(torsoGeo, torsoMat);
                    torso.position.y = 0.95;
                    target.add(torso);
                    
                    // Head shape varies
                    let headGeo;
                    if (state.headShape === 'head_round' || state.headShape === 'sphere') {
                        headGeo = new THREE.SphereGeometry(0.35, 12, 12);
                    } else if (state.headShape === 'head_square' || state.headShape === 'box') {
                        headGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
                    } else {
                        headGeo = new THREE.ConeGeometry(0.35, 0.6, 8);
                    }
                    const headMat = new THREE.MeshStandardMaterial({ color: state.skinColor });
                    const head = new THREE.Mesh(headGeo, headMat);
                    head.position.y = 1.7;
                    target.add(head);
                    
                    // Hair (colored cylinder/shape)
                    const hairGeo = new THREE.SphereGeometry(0.38, 12, 12);
                    const hairMat = new THREE.MeshStandardMaterial({ color: state.hairColor });
                    const hair = new THREE.Mesh(hairGeo, hairMat);
                    hair.position.y = 1.9;
                    target.add(hair);
                    
                    // Eyes
                    const eyeGeo = new THREE.SphereGeometry(0.08, 8, 8);
                    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                    const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
                    const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
                    
                    if (state.eyesStyle === 'eyes_normal') {
                        leftEye.position.set(-0.12, 0.15, 0.3);
                        rightEye.position.set(0.12, 0.15, 0.3);
                    } else if (state.eyesStyle === 'eyes_happy') {
                        leftEye.position.set(-0.12, 0.1, 0.3);
                        rightEye.position.set(0.12, 0.1, 0.3);
                        leftEye.scale.set(1.2, 0.7, 1);
                        rightEye.scale.set(1.2, 0.7, 1);
                    } else if (state.eyesStyle === 'eyes_sleepy') {
                        leftEye.position.set(-0.12, 0.15, 0.3);
                        rightEye.position.set(0.12, 0.15, 0.3);
                        leftEye.scale.set(1.3, 0.4, 1);
                        rightEye.scale.set(1.3, 0.4, 1);
                    } else { // eyes_surprised
                        leftEye.position.set(-0.12, 0.2, 0.3);
                        rightEye.position.set(0.12, 0.2, 0.3);
                        leftEye.scale.set(1.3, 1.3, 1);
                        rightEye.scale.set(1.3, 1.3, 1);
                    }
                    target.add(leftEye, rightEye);
                    
                    // Hat accessory
                    if (state.selectedAccessory && state.selectedAccessory !== 'none') {
                        let hatGeo;
                        let hatColor = ACCESSORIES_CATALOG[state.selectedAccessory]?.color || 0x111827;
                        if (state.selectedAccessory.includes('tophat')) {
                            hatGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.5, 8);
                        } else if (state.selectedAccessory.includes('crown')) {
                            hatGeo = new THREE.ConeGeometry(0.35, 0.35, 8);
                        } else if (state.selectedAccessory.includes('cowboy')) {
                            hatGeo = new THREE.ConeGeometry(0.4, 0.2, 8);
                        } else {
                            hatGeo = new THREE.ConeGeometry(0.35, 0.25, 12);
                        }
                        const hatMat = new THREE.MeshStandardMaterial({ color: hatColor });
                        const hat = new THREE.Mesh(hatGeo, hatMat);
                        hat.position.y = 2.1;
                        target.add(hat);
                    }
                    
                    // Carry item
                    if (state.selectedCarry && state.selectedCarry !== 'none') {
                        if (state.selectedCarry.includes('umbrella')) {
                            const umbrellaGeo = new THREE.ConeGeometry(0.4, 0.6, 8);
                            const umbrellaColor = ACCESSORIES_CATALOG[state.selectedCarry]?.color || (state.selectedCarry.includes('red') ? 0xdc2626 : 0x3b82f6);
                            const umbrellaMat = new THREE.MeshStandardMaterial({ color: umbrellaColor });
                            const umbrella = new THREE.Mesh(umbrellaGeo, umbrellaMat);
                            umbrella.position.set(0.5, 1.2, 0);
                            target.add(umbrella);
                        } else if (state.selectedCarry.includes('backpack')) {
                            const backpackGeo = new THREE.BoxGeometry(0.3, 0.5, 0.2);
                            const backpackColor = ACCESSORIES_CATALOG[state.selectedCarry]?.color || (state.selectedCarry.includes('red') ? 0xdc2626 : 0x22c55e);
                            const backpackMat = new THREE.MeshStandardMaterial({ color: backpackColor });
                            const backpack = new THREE.Mesh(backpackGeo, backpackMat);
                            backpack.position.set(-0.4, 1.2, -0.1);
                            target.add(backpack);
                        }
                    }
                };
                
                buildCharacter(previewPlayer);
            }

            // Start game button
            const startBtn = document.getElementById('start-game-btn');
            if (startBtn) startBtn.addEventListener('click', () => {
                state.gameStarted = true;
                const modal = document.getElementById('customization-modal');
                if (modal) modal.classList.add('hidden');
            });

            // init preview
            createPreview();
        }

        function changeWeather() {
            const rolls = ['clear', 'rain', 'snow', 'storm'];
            state.targetWeather = rolls[Math.floor(Math.random() * rolls.length)];
            const icons = { clear: '☀️ Clear', rain: '🌧️ Rain', snow: '❄️ Snow', storm: '⛈️ Storm' };
            const el = document.getElementById('weather-info');
            if (el) el.innerText = icons[state.targetWeather];
            SFX.weather();
        }

        const skyColors = { top: new THREE.Color(0x87ceeb), bottom: new THREE.Color(0xe0f2fe) };

        function updateAtmosphere(delta) {
            state.time += delta;
            const cycleProgress = (state.time % DAY_LENGTH) / DAY_LENGTH;
            sunOrbit.rotation.z = cycleProgress * Math.PI * 2 + Math.PI;

            if (state.weather !== state.targetWeather) {
                state.weatherIntensity -= delta * 0.05;
                if (state.weatherIntensity <= 0) { state.weatherIntensity = 0; state.weather = state.targetWeather; }
            } else {
                state.weatherIntensity = THREE.MathUtils.lerp(state.weatherIntensity, 1, delta * 0.05);
            }

            let tTop, tBottom;
            const isNight = cycleProgress < 0.25 || cycleProgress > 0.75;
            if (isNight) { tTop = new THREE.Color(0x0f172a); tBottom = new THREE.Color(0x1e293b); stars.visible = true; sun.intensity = 0.1; }
            else if (cycleProgress < 0.35 || cycleProgress > 0.65) { 
                if (state.skyMode === 'rare-pink') { tTop = new THREE.Color(0xf43f5e); tBottom = new THREE.Color(0xfb923c); }
                else if (state.skyMode === 'rare-purple') { tTop = new THREE.Color(0x8b5cf6); tBottom = new THREE.Color(0xf97316); }
                else { tTop = new THREE.Color(0xf6ad55); tBottom = new THREE.Color(0xed8936); }
                stars.visible = false; sun.intensity = 0.4; 
            } else { tTop = new THREE.Color(0x87ceeb); tBottom = new THREE.Color(0xe0f2fe); stars.visible = false; sun.intensity = 1.0; }
            
            if (state.weather === 'storm' || state.weather === 'rain') {
                const stormCol = new THREE.Color(0x4a5568);
                tTop.lerp(stormCol, state.weatherIntensity * 0.5);
                tBottom.lerp(stormCol, state.weatherIntensity * 0.3);
            }
            
            skyColors.top.lerp(tTop, 0.01); skyColors.bottom.lerp(tBottom, 0.01);
            const grad = skyCtx.createLinearGradient(0, 0, 0, skyCanvas.height);
            grad.addColorStop(0, `#${skyColors.top.getHexString()}`);
            grad.addColorStop(1, `#${skyColors.bottom.getHexString()}`);
            skyCtx.fillStyle = grad; skyCtx.fillRect(0, 0, skyCanvas.width, skyCanvas.height);
            skyTexture.needsUpdate = true;

            const currentBiome = getBiomeAt(Math.PI/2, state.playerTheta);
            globe.material.color.lerp(new THREE.Color(BIOMES[currentBiome].ground), 0.015);
            if (state.currentBiome !== currentBiome) {
                state.currentBiome = currentBiome;
                recordEvent('visit_biomes', { biomeKey: currentBiome });
            }

            const sunPos = new THREE.Vector3(); sunOrbit.children[1].getWorldPosition(sunPos);
            const screenPos = sunPos.clone().project(camera);
            if (screenPos.z < 1 && Math.abs(screenPos.x) < 1.1 && Math.abs(screenPos.y) < 1.1) {
                lensFlare.position.copy(sunPos).multiplyScalar(0.9);
                lensFlare.material.opacity = THREE.MathUtils.lerp(lensFlare.material.opacity, 1.0, 0.05);
            } else lensFlare.material.opacity = THREE.MathUtils.lerp(lensFlare.material.opacity, 0, 0.05);

            moon.mesh.material.color.setHSL(0, 0, 0.9 - (state.moonPhase * 0.1));

            weatherParticles.material.opacity = state.weatherIntensity * 0.5;
            if (weatherParticles.visible) {
                const pos = weatherParticles.geometry.attributes.position.array;
                for(let i=1; i<pos.length; i+=3) {
                    pos[i] -= 5 * delta;
                    if(pos[i] < 0) pos[i] = 30;
                }
                weatherParticles.geometry.attributes.position.needsUpdate = true;
            }

            // Occasionally spawn a shooting star
            if (Math.random() < 0.0006) createShootingStar();
            // update shooting stars
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const s = shootingStars[i];
                s.age += delta;
                s.mesh.position.add(s.velocity.clone().multiplyScalar(delta));
                s.material.opacity = Math.max(0, 1 - s.age / s.lifetime);
                if (s.age > s.lifetime) { scene.remove(s.mesh); shootingStars.splice(i, 1); }
            }
        }

        function createShootingStar() {
            const geom = new THREE.BoxGeometry(0.2, 0.2, 4);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1.0 });
            const mesh = new THREE.Mesh(geom, mat);
            // spawn above horizon
            const phi = Math.random() * Math.PI * 0.4; // near sky
            const theta = Math.random() * Math.PI * 2 - Math.PI;
            const pos = new THREE.Vector3().setFromSphericalCoords(GLOBE_RADIUS + 40, phi, theta);
            mesh.position.copy(pos);
            mesh.lookAt(new THREE.Vector3(0,0,0));
            mesh.rotation.x += 0.5;
            scene.add(mesh);
            shootingStars.push({ mesh, material: mat, velocity: new THREE.Vector3((Math.random()-0.5)*-40, -5, 0), age: 0, lifetime: 1.8 });
        }

        function updateWildlife(delta) {
            const time = Date.now() * 0.001;
            entities.forEach(ent => {
                if (ent.collected) return;
                if (ent.type === 'bird') {
                    const flap = Math.sin(time * 12) * 0.5;
                    ent.wingL.rotation.z = flap; ent.wingR.rotation.z = -flap;
                    ent.bGroup.position.x = Math.sin(time * 0.5 + ent.offset) * 4;
                    ent.bGroup.position.z = Math.cos(time * 0.5 + ent.offset) * 4;
                } else if (ent.type === 'butterfly') {
                    const flap = Math.sin(time * 15) * 0.8;
                    ent.leftWing.rotation.z = flap; ent.rightWing.rotation.z = -flap;
                    ent.bGroup.position.x = Math.sin(time + ent.offset) * 0.8;
                    ent.bGroup.position.z = Math.cos(time + ent.offset) * 0.8;
                } else if (ent.animalGroup) {
                    ent.animalGroup.rotation.y = Math.sin(time + ent.offset) * 0.1;
                    ent.animalGroup.position.y = Math.abs(Math.sin(time * 2 + ent.offset)) * 0.1 + 0.4;
                } else if (ent.type === 'firefly') {
                    ent.mesh.visible = (state.time % DAY_LENGTH) / DAY_LENGTH > 0.7 || (state.time % DAY_LENGTH) / DAY_LENGTH < 0.3;
                    if (ent.light) ent.light.intensity = ent.mesh.visible ? 1.0 : 0;
                } else if (ent.type === 'cloud') {
                    ent.mesh.rotateY(delta * ent.drift);
                } else if (ent.type === 'coin' && ent.coinMesh) {
                    ent.coinMesh.rotateY(delta * 2);
                    ent._coinBaseY = ent._coinBaseY || ent.coinMesh.position.y;
                    ent.coinMesh.position.y = ent._coinBaseY + Math.sin(time * 3 + ent.offset) * 0.15;
                    if (Math.random() < 0.003 && SFX.coin) SFX.coin();
                } else if (ent.type === 'fox') {
                    ent.stateTime += delta;
                    if (ent.state === 'idle' && ent.stateTime > 3) { ent.state = 'jump'; ent.stateTime = 0; }
                    if (ent.state === 'jump') {
                        const progress = ent.stateTime / 0.9;
                        if (progress > 1) { ent.state = 'idle'; ent.stateTime = 0; ent.animalGroup.position.y = 0.35; ent.animalGroup.scale.y = 1; }
                        else {
                            ent.animalGroup.position.y = 0.35 + Math.sin(progress * Math.PI) * 0.9;
                            const squash = 1.0 + Math.sin(progress * Math.PI) * 0.3;
                            ent.animalGroup.scale.y = 1/squash;
                        }
                    }
                    // simple flee behavior after jump
                    try {
                        const dPhi = ent.phi - state.playerPhi;
                        const dTheta = ent.theta - state.playerTheta;
                        const angProx = Math.abs(dPhi) + Math.abs(dTheta);
                        if (angProx < 0.8) {
                            const dir = (dTheta >= 0) ? 1 : -1;
                            ent.theta += dir * delta * 0.9;
                            const altitude = GLOBE_RADIUS;
                            ent.mesh.position.copy(new THREE.Vector3().setFromSphericalCoords(altitude, ent.phi, ent.theta));
                            const normal = ent.mesh.position.clone().normalize();
                            ent.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), normal);
                        }
                    } catch(e) {}
                } else if (ent.type === 'crab') {
                    ent.animalGroup.position.x = Math.sin(time * 3 + ent.offset) * 0.4;
                } else if (ent.type === 'redpanda') {
                    ent.animalGroup.rotation.y = Math.sin(time + ent.offset) * 0.2;
                    ent.animalGroup.position.y = Math.abs(Math.sin(time * 1.5 + ent.offset)) * 0.06 + 0.35;
                } else if (ent.type === 'monkey' || ent.type === 'koala' || ent.type === 'flamingo') {
                    // Gentle idle sway for small mammals and birds
                    if (ent.animalGroup) {
                        ent.animalGroup.rotation.y = Math.sin(time + ent.offset) * 0.25;
                        ent.animalGroup.position.y = 0.4 + Math.abs(Math.sin(time * 1.6 + ent.offset)) * 0.06;
                        if (ent.type === 'monkey') {
                            // simulate climbing: oscillate arm and vertical offset
                            ent.climbState += delta * 1.2;
                            ent.animalGroup.position.y = 0.35 + Math.abs(Math.sin(ent.climbState)) * 0.5;
                            if (ent.animalGroup.children[2]) ent.animalGroup.children[2].rotation.z = -0.6 + Math.sin(ent.climbState) * 0.6;
                        // occasional monkey sound
                        if (ent.type === 'monkey' && Math.random() < 0.002 && SFX.monkey) SFX.monkey();
                        }
                        if (ent.type === 'flamingo' && ent.legs) {
                            // subtle leg bend
                            const legMotion = Math.sin(time * 3 + ent.offset) * 0.12;
                            ent.legs.l.rotation.z = legMotion; ent.legs.r.rotation.z = -legMotion;
                            if (Math.random() < 0.0015 && SFX.flamingo) SFX.flamingo();
                        }
                        if (ent.type === 'koala' && Math.random() < 0.0009 && SFX.koala) SFX.koala();
                    }
                } else if (ent.type === 'feline') {
                    // Stalk/pounce behavior
                    ent.stateTime += delta;
                    if (!ent.state) ent.state = 'idle';
                    if (ent.state === 'idle' && ent.stateTime > 4) { ent.state = 'pounce'; ent.stateTime = 0; }
                    if (ent.state === 'pounce') {
                        const p = ent.stateTime / 0.8;
                        if (p > 1) { ent.state = 'idle'; ent.stateTime = 0; ent.animalGroup.position.y = 0.35; ent.animalGroup.scale.y = 1; }
                        else { ent.animalGroup.position.y = 0.35 + Math.sin(p * Math.PI) * 0.7; ent.animalGroup.scale.y = 1/(1 + Math.sin(p * Math.PI) * 0.25); }
                    }
                }
            });
        }

        function checkCollisions() {
            const playerPos = new THREE.Vector3(0, GLOBE_RADIUS, 0); 
            let onBridge = false;
            state.nearWater = false;
            
            // Check for nearby water areas
            for(let i = 0; i < 8; i++) {
                const checkTheta = state.playerTheta + (i - 4) * 0.3;
                if (isWaterAt(state.playerPhi, checkTheta)) {
                    state.nearWater = true;
                    break;
                }
            }
            
            entities.forEach(ent => {
                if (ent.collected || ent.type === 'cloud') return;
                const entityPos = new THREE.Vector3(); ent.mesh.getWorldPosition(entityPos);
                const dist = playerPos.distanceTo(entityPos);
                if (ent.type === 'bridge' && dist < 4.0) onBridge = true;
                if (dist < 2.5) {
                        if (ent.type === 'coin') {
                            if (dist < 2.2) {
                                state.bells += ITEM_TYPES.COIN.value; document.getElementById('bells-display').innerText = state.bells;
                                ent.collected = true; ent.mesh.visible = false; if (SFX.coin) SFX.coin();
                                // floating coin text
                                const cpos = new THREE.Vector3(); ent.mesh.getWorldPosition(cpos);
                                createFloatingText(`+${ITEM_TYPES.COIN.emoji}`, cpos, ITEM_TYPES.COIN.color);
                                recordEvent('earn_bells', { amount: ITEM_TYPES.COIN.value });
                            }
                        } else {
                        const h = ['flower', 'bird', 'penguin', 'polarbear', 'camel', 'zebra', 'giraffe', 'elephant', 'fish', 'bush', 'ladybug', 'firefly', 'redpanda', 'fox', 'ostrich', 'crab', 'monkey', 'koala', 'flamingo', 'feline'];
                        if (h.includes(ent.type) && dist < 2.2) collectItem(ITEM_TYPES[ent.type.toUpperCase().replace(' ','')], ent);
                        else if (['shop', 'house'].includes(ent.type)) openShop(ent);
                        else if (ent.type === 'tree' && ent.hasFruit && dist < 2.2) collectItem(ITEM_TYPES.APPLE, ent);
                    }
                }
            });
            return onBridge;
        }

        function createFloatingText(text, worldPos, color = 0xffffff) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 48px sans-serif';
            ctx.fillStyle = `rgb(${(color >> 16) & 255}, ${(color >> 8) & 255}, ${color & 255})`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 3;
            ctx.strokeText(text, 128, 64);
            ctx.fillText(text, 128, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(4, 2, 1);
            sprite.position.copy(worldPos);
            scene.add(sprite);

            const floatText = {
                sprite,
                age: 0,
                lifetime: 1.5,
                startPos: worldPos.clone()
            };
            floatingTexts.push(floatText);
            return floatText;
        }

        function updateFloatingTexts(delta) {
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.age += delta;
                const progress = ft.age / ft.lifetime;
                
                if (progress >= 1) {
                    scene.remove(ft.sprite);
                    floatingTexts.splice(i, 1);
                } else {
                    ft.sprite.position.y = ft.startPos.y + progress * 3;
                    ft.sprite.material.opacity = 1 - progress;
                }
            }
        }

        function collectItem(type, entity) {
            if (!type) return;
            const itemKey = type.key || ITEM_KEY_BY_NAME[type.name] || type.name.toUpperCase().replace(' ', '');
            const biomeKey = getBiomeAt(state.playerPhi, state.playerTheta);
            const existing = state.inventory.find(i => i.name === type.name);
            if (existing) {
                existing.count++;
                existing.byBiome = existing.byBiome || {};
                existing.byBiome[biomeKey] = (existing.byBiome[biomeKey] || 0) + 1;
            } else {
                state.inventory.push({ ...type, key: itemKey, count: 1, byBiome: { [biomeKey]: 1 } });
            }
            if (entity.type !== 'bridge') { entity.collected = true; entity.mesh.visible = false; }
            
            // Floating text feedback
            const itemPos = new THREE.Vector3();
            entity.mesh.getWorldPosition(itemPos);
            createFloatingText(`+${type.emoji}`, itemPos, type.color || 0xffffff);
            
            updateInventoryUI(); 
            updateQuestDisplay(); // check quest progress
            SFX.gather();
            recordEvent('collect_item', { target: itemKey, count: 1 });
            if (ANIMAL_ITEM_KEYS.includes(itemKey)) recordEvent('collect_animal', { target: itemKey, count: 1 });
            if (itemKey === 'FISH') recordEvent('fish_catch', { count: 1 });
        }

        function updateInventoryUI() {
            const bar = document.getElementById('inventory-bar');
            if (!bar) return; bar.innerHTML = '';
            for(let i=0; i<8; i++) {
                const item = state.inventory[i];
                const slot = document.createElement('div');
                slot.className = 'w-12 h-12 border-2 border-amber-200 bg-amber-50 rounded-xl flex items-center justify-center relative text-xl shadow-inner';
                if (item) slot.innerHTML = `<span class="fade-in">${item.emoji}</span><span class="absolute -bottom-1 -right-1 bg-amber-600 text-white text-[10px] px-1 rounded-md font-bold">${item.count}</span>`;
                bar.appendChild(slot);
            }
            const display = document.getElementById('bells-display');
            if (display) display.innerText = state.bells;
        }

        function openShop(shopEntity) {
            state.currentShop = shopEntity.shopNPC || SHOP_NPCS[0];
            const list = document.getElementById('shop-items');
            const shopName = document.getElementById('shop-name');
            const shopDesc = document.getElementById('shop-desc');
            const shopBonus = document.getElementById('shop-bonus');
            
            if (!list) return; 
            list.innerHTML = '';
            shopName.innerText = `${state.currentShop.emoji} ${state.currentShop.name}'s Shop`;
            shopDesc.innerText = `Special ${state.currentShop.biome} goods! Items sell for ${(state.currentShop.buyMultiplier * 100).toFixed(0)}% value`;
            if (shopBonus) {
                shopBonus.innerText = `⭐ Featured: ${state.featuredBiome} +15% • 🗓️ ${state.weeklyMutator.replace(/_/g, ' ')}`;
            }
            
            // Show inventory items for sale
            state.inventory.forEach(item => {
                const featuredCount = item.byBiome?.[state.featuredBiome] || 0;
                const baseValue = item.value * item.count;
                const featuredBonus = featuredCount * item.value * 0.15;
                const saleValue = Math.floor((baseValue + featuredBonus) * state.currentShop.buyMultiplier);
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-white/50 p-2 rounded-lg border border-amber-100';
                const itemKey = item.key || ITEM_KEY_BY_NAME[item.name];
                const isSpecial = itemKey && state.currentShop.specialty.includes(itemKey);
                const specialTag = isSpecial ? ' ⭐' : '';
                const featuredTag = featuredCount > 0 ? ' ✨' : '';
                div.innerHTML = `<span class="font-medium">${item.emoji} ${item.name} x${item.count}${specialTag}${featuredTag}</span><span class="font-bold text-green-600">${saleValue}💰</span>`;
                list.appendChild(div);
            });
            
            // Show available accessories for purchase
            if (state.currentShop.accessories) {
                const accessoryDiv = document.createElement('div');
                accessoryDiv.className = 'mt-4 border-t pt-2';
                accessoryDiv.innerHTML = '<div class="font-semibold mb-2">Accessories for Sale:</div>';
                state.currentShop.accessories.forEach(accName => {
                    const acc = ACCESSORIES_CATALOG[accName];
                    if (!acc) return;
                    const isUnlocked = state.unlockedAccessories.includes(accName);
                    const statusText = isUnlocked ? '✓ Owned' : `${acc.cost}💰`;
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-center bg-white/50 p-2 rounded-lg border border-yellow-100 cursor-pointer hover:bg-white/70';
                    div.innerHTML = `<span class="font-medium">${accName}: ${acc.name}</span><span class="font-bold text-amber-600">${statusText}</span>`;
                    div.onclick = () => {
                        if (!isUnlocked && state.bells >= acc.cost) {
                            state.bells -= acc.cost;
                            state.unlockedAccessories.push(accName);
                            if (state.meta && !state.meta.unlockedAccessories.includes(accName)) {
                                state.meta.unlockedAccessories.push(accName);
                                saveMeta();
                            }
                            createFloatingText(`Unlocked: ${acc.name}!`, new THREE.Vector3(0, GLOBE_RADIUS + 5, 0), 0xf59e0b);
                            SFX.levelup();
                            openShop(shopEntity); // refresh shop display
                        } else if (!isUnlocked) {
                            alert(`Need ${acc.cost - state.bells} more bells!`);
                        }
                    };
                    accessoryDiv.appendChild(div);
                });
                list.appendChild(accessoryDiv);
            }
            
            const modal = document.getElementById('shop-modal');
            if (modal && modal.classList.contains('hidden')) { modal.classList.remove('hidden'); modal.classList.add('flex'); SFX.click(); }
            // show NPC greeting if available
            const npcGreeting = document.getElementById('shop-npc-greeting');
            if (npcGreeting) npcGreeting.innerText = `${state.currentShop.emoji} Hello! I'm ${state.currentShop.name}. I like ${state.currentShop.specialty.join(', ')}.`;
            // show available quest if not completed
            const questBtn = document.getElementById('offer-quest-btn');
            const myQuest = QUESTS.find(q => q.npc === state.currentShop.name && !state.completedQuests.includes(q.id));
            if (questBtn && myQuest) { questBtn.style.display = 'block'; questBtn.innerText = `📜 Quest: ${myQuest.objective} (Reward: ${myQuest.reward}💰)`; questBtn.onclick = () => acceptQuest(myQuest); }
            else if (questBtn) questBtn.style.display = 'none';
        }

        function acceptQuest(quest) {
            state.activeQuest = { ...quest, progress: 0 };
            SFX.levelup();
            createFloatingText(`Quest: ${quest.objective}`, new THREE.Vector3(0, GLOBE_RADIUS + 5, 0), 0x60a5fa);
            updateQuestDisplay();
        }

        function updateQuestDisplay() {
            const qLog = document.getElementById('quest-log');
            if (!qLog) return;
            if (!state.activeQuest) {
                qLog.innerHTML = '<span class="text-gray-400 text-sm">No active quest</span>';
                return;
            }
            const q = state.activeQuest;
            const collected = state.inventory.reduce((sum, item) => item.name === ITEM_TYPES[q.target].name ? sum + item.count : sum, 0);
            q.progress = Math.min(collected, q.count);
            qLog.innerHTML = `<div class="text-sm font-medium">${q.npc}: ${q.objective}</div><div class="w-full bg-gray-200 rounded-full h-2 mt-1"><div class="bg-blue-500 h-2 rounded-full" style="width: ${(q.progress/q.count)*100}%"></div></div><span class="text-xs text-gray-600">${q.progress}/${q.count}</span>`;
            if (q.progress >= q.count) completeQuest(q);
        }

        function completeQuest(quest) {
            if (state.completedQuests.includes(quest.id)) return;
            state.completedQuests.push(quest.id);
            state.bells += quest.reward;
            state.activeQuest = null;
            SFX.levelup();
            createFloatingText(`Quest Complete! +${quest.reward}💰`, new THREE.Vector3(0, GLOBE_RADIUS + 5, 0), 0xfbbf24);
            document.getElementById('bells-display').innerText = state.bells;
            updateQuestDisplay();
            recordEvent('complete_quest', { count: 1 });
            recordEvent('earn_bells', { amount: quest.reward });
        }

        function closeShop() {
            const modal = document.getElementById('shop-modal');
            if (modal) { modal.classList.add('hidden'); modal.classList.remove('flex'); SFX.click(); }
            state.currentShop = null;
        }

        function sellAll() {
            if (!state.currentShop) return;
            let total = 0;
            let totalItems = 0;
            let specialtyCount = 0;
            state.inventory.forEach(i => {
                totalItems += i.count;
                const featuredCount = i.byBiome?.[state.featuredBiome] || 0;
                const baseValue = i.value * i.count;
                const featuredBonus = featuredCount * i.value * 0.15;
                const itemPrice = Math.floor((baseValue + featuredBonus) * state.currentShop.buyMultiplier);
                total += itemPrice;
                const itemKey = i.key || ITEM_KEY_BY_NAME[i.name];
                if (itemKey && state.currentShop.specialty.includes(itemKey)) {
                    specialtyCount += i.count;
                }
            });
            
            if (total > 0) {
                state.bells += total; 
                createFloatingText(`+${total}💰`, new THREE.Vector3(0, GLOBE_RADIUS + 5, 0), 0xffd700);
                state.inventory = [];
                updateInventoryUI(); 
                closeShop();
                SFX.sell();
                
                // Level up sound at certain thresholds
                if ((state.bells - total < 5000 && state.bells >= 5000) ||
                    (state.bells - total < 10000 && state.bells >= 10000) ||
                    (state.bells - total < 50000 && state.bells >= 50000)) {
                    SFX.levelup();
                }
                recordEvent('sell_items', { count: totalItems });
                if (specialtyCount > 0) recordEvent('sell_specialty', { count: specialtyCount });
                recordEvent('earn_bells', { amount: total });
            }
        }

        let fishingState = { active: false, progress: 0, success: false };

        function openFishing() {
            state.fishingMode = true;
            fishingState = { active: false, progress: 0, success: false };
            const modal = document.getElementById('fishing-modal');
            if (modal && modal.classList.contains('hidden')) { 
                modal.classList.remove('hidden'); 
                modal.classList.add('flex'); 
                SFX.click(); 
            }
        }

        function closeFishing() {
            const modal = document.getElementById('fishing-modal');
            if (modal) { 
                modal.classList.add('hidden'); 
                modal.classList.remove('flex'); 
                SFX.click();
            }
            state.fishingMode = false;
            fishingState.active = false;
        }

        function castFishingLine() {
            if (fishingState.active) return;
            fishingState.active = true;
            fishingState.progress = 0;
            fishingState.success = false;
            
            const castDuration = 3;
            const hitTime = Math.random() * (castDuration - 0.5) + 0.2;
            const startTime = Date.now() * 0.001;

            const checkFish = setInterval(() => {
                const elapsed = Date.now() * 0.001 - startTime;
                const progress = Math.min(elapsed / castDuration, 1);
                fishingState.progress = progress;
                
                const bar = document.getElementById('fishing-bar');
                if (bar) bar.style.width = (progress * 100) + '%';

                if (progress >= 1) {
                    clearInterval(checkFish);
                    fishingState.active = false;
                    if (fishingState.success) {
                        document.getElementById('fishing-status').innerText = '🎣 Caught a fish!';
                        collectItem(ITEM_TYPES.FISH, { type: 'fish', mesh: { getWorldPosition: () => new THREE.Vector3(0, GLOBE_RADIUS, 0) }, collected: false });
                        SFX.fish();
                    } else {
                        document.getElementById('fishing-status').innerText = 'Fish got away...';
                    }
                    setTimeout(() => {
                        document.getElementById('fishing-status').innerText = 'Cast your line...';
                        fishingState.progress = 0;
                        const bar = document.getElementById('fishing-bar');
                        if (bar) bar.style.width = '0%';
                    }, 1500);
                }
            }, 16);

            // Add random catch window
            setTimeout(() => {
                fishingState.success = true;
            }, hitTime * 1000);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            if (joystick.dx !== 0 || joystick.dy !== 0) {
                const speed = 0.12 * delta; 
                const nextTheta = state.playerTheta - (joystick.dx * speed * 2.5);
                const nextPhi = state.playerPhi - (joystick.dy * speed * 2.5);
                const isBlocked = isWaterAt(nextPhi, nextTheta);
                const onBridge = checkCollisions();

                if (!isBlocked || onBridge) {
                    state.playerTheta = nextTheta;
                    state.playerPhi = nextPhi;
                    globe.rotation.set(0, 0, 0);
                    globe.rotateX(state.playerPhi - Math.PI / 2);
                    globe.rotateY(-state.playerTheta);
                }
                const targetRotation = Math.atan2(joystick.dx, joystick.dy);
                player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, targetRotation, 0.08);
                player.position.y = Math.abs(Math.sin(Date.now() * 0.005)) * 0.1;
            } else {
                player.position.y = THREE.MathUtils.lerp(player.position.y, 0, 0.1);
                checkCollisions();
            }
            
            // Offer fishing when near water
            if (state.nearWater && !state.fishingMode) {
                const hint = document.getElementById('fishing-hint');
                if (hint) hint.classList.remove('hidden');
            } else {
                const hint = document.getElementById('fishing-hint');
                if (hint) hint.classList.add('hidden');
                if (state.fishingMode) closeFishing();
            }
            
            // Adaptive spawn rate: slower when approaching entity cap
            const spawnRate = entities.length > MAX_ENTITIES * 0.8 ? 0.002 : 0.008;
            if (Math.random() < spawnRate) spawnProceduralEntity();
            updateAtmosphere(delta);
            updateWildlife(delta);
            updateFloatingTexts(delta);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>

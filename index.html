    <script>
        // --- Sound Engine ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration, vol = 0.1) {
            if (audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Audio buffer cache - will be populated by loadSoundAssets()
        const audioBuffers = {};
        let audioContext = null;
        const audioContextReady = initAudioContext();
        
        function initAudioContext() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                return true;
            } catch (e) {
                console.warn('Audio context not available', e);
                return false;
            }
        }
        
        // Load all sound assets from /sounds folder
        async function loadSoundAssets() {
            const sounds = ['gather', 'sell', 'click', 'weather', 'fish', 'levelup', 'coin', 'birdcall', 'monkey', 'koala', 'flamingo', 'feline', 'fox'];
            for (const name of sounds) {
                try {
                    const response = await fetch(`sounds/${name}.wav`);
                    const buffer = await response.arrayBuffer();
                    if (buffer.byteLength > 0) {
                        audioBuffers[name] = await audioContext.decodeAudioData(buffer);
                    } else {
                        audioBuffers[name] = null; // Placeholder file
                    }
                } catch (e) {
                    console.warn(`Failed to load sound: ${name}`, e);
                    audioBuffers[name] = null;
                }
            }
        }
        
        function playSoundAsset(name) {
            if (!audioContext || !audioBuffers[name]) {
                // Fallback to tone generation if sound not loaded
                const fallbacks = {
                    gather: () => { playTone(440, 'sine', 0.2); setTimeout(() => playTone(660, 'sine', 0.2), 50); },
                    sell: () => { playTone(523.25, 'triangle', 0.5); setTimeout(() => playTone(659.25, 'triangle', 0.5), 100); },
                    click: () => playTone(300, 'sine', 0.1, 0.05),
                    weather: () => playTone(200, 'sine', 1, 0.05),
                    fish: () => { playTone(659.25, 'sine', 0.3); setTimeout(() => playTone(783.99, 'sine', 0.3), 100); },
                    levelup: () => { playTone(523.25, 'triangle', 0.2); setTimeout(() => playTone(659.25, 'triangle', 0.2), 100); setTimeout(() => playTone(783.99, 'triangle', 0.3), 200); },
                    coin: () => { playTone(880, 'sine', 0.08, 0.08); setTimeout(() => playTone(1100, 'sine', 0.06, 0.06), 60); },
                    birdcall: () => { playTone(660, 'sine', 0.06, 0.04); setTimeout(() => playTone(880, 'sine', 0.04, 0.03), 80); },
                    monkey: () => { playTone(420, 'sine', 0.08, 0.05); setTimeout(() => playTone(520, 'sine', 0.06, 0.04), 80); },
                    koala: () => { playTone(320, 'sine', 0.12, 0.04); },
                    flamingo: () => { playTone(720, 'sine', 0.05, 0.03); setTimeout(() => playTone(660, 'sine', 0.04, 0.02), 60); },
                    feline: () => { playTone(300, 'triangle', 0.06, 0.04); setTimeout(() => playTone(380, 'triangle', 0.04, 0.03), 60); },
                    fox: () => { playTone(560, 'sine', 0.06, 0.04); setTimeout(() => playTone(440, 'sine', 0.05, 0.03), 90); }
                };
                if (fallbacks[name]) fallbacks[name]();
                return;
            }
            try {
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffers[name];
                source.connect(audioContext.destination);
                source.start(0);
            } catch (e) {
                console.warn(`Error playing sound: ${name}`, e);
            }
        }
        
        const SFX = {

        const REWARD_TIERS = [
            { points: 100, unlock: ['hat_crown'], label: 'Crown' },
            { points: 250, unlock: ['hat_cowboy'], label: 'Cowboy Hat' },
            { points: 450, unlock: ['umbrella_blue'], label: 'Blue Umbrella' },
            { points: 700, unlock: ['backpack_green'], label: 'Green Backpack' },
            { points: 1000, unlock: ['hat_tophat_cream', 'umbrella_yellow', 'backpack_purple'], label: 'Color Variants' }
        ];
        const BIOME_KEYS = Object.keys(BIOMES);
        const ITEM_KEY_BY_NAME = Object.fromEntries(Object.entries(ITEM_TYPES).map(([k, v]) => [v.name, k]));
        
        let weatherParticles, skyTexture, skyCanvas, skyCtx;

        function getTodayKey() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function getWeekKey() {
            const d = new Date();
            const target = new Date(d.valueOf());
            const dayNr = (d.getDay() + 6) % 7;
            target.setDate(target.getDate() - dayNr + 3);
            const firstThursday = new Date(target.getFullYear(), 0, 4);
            const diff = target - firstThursday;
            const week = 1 + Math.round(diff / (7 * 24 * 3600 * 1000));
            return `${target.getFullYear()}-W${String(week).padStart(2, '0')}`;
        }

        function hashString(str) {
            let h = 2166136261;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            return h >>> 0;
        }

        function mulberry32(seed) {
            return function() {
                let t = seed += 0x6D2B79F5;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function seededRng(key) {
            return mulberry32(hashString(key));
        }

        function pickFrom(arr, rng) {
            return arr[Math.floor(rng() * arr.length)];
        }

        function pluralize(word, count) {
            if (count === 1) return word;
            if (word.endsWith('s')) return word;
            return `${word}s`;
        }

        function createChallenge(kind, rng, isWeekly) {
            const weekly = !!isWeekly;
            const reward = weekly ? 90 : 30;
            if (kind === 'collect_item') {
                const target = pickFrom(COMMON_ITEM_KEYS, rng);
                const count = weekly ? 20 : 6;
                return {
                    id: `collect_item_${target}`,
                    kind,
                    target,
                    count,
                    progress: 0,
                    rewardPoints: reward,
                    completed: false,
                    label: `Collect ${count} ${pluralize(ITEM_TYPES[target].name, count)}`
                };
            }
            if (kind === 'collect_animal') {
                const target = pickFrom(ANIMAL_ITEM_KEYS, rng);
                const count = weekly ? 6 : 2;
                return {
                    id: `collect_animal_${target}`,
                    kind,
                    target,
                    count,
                    progress: 0,
                    rewardPoints: reward + (weekly ? 20 : 10),
                    completed: false,
                    label: `Collect ${count} ${pluralize(ITEM_TYPES[target].name, count)}`
                };
            }
            if (kind === 'fish_catch') {
                const count = weekly ? 8 : 2;
                return {
                    id: `fish_catch_${count}`,
                    kind,
                    target: 'FISH',
                    count,
                    progress: 0,
                    rewardPoints: reward + 10,
                    completed: false,
                    label: `Catch ${count} fish`
                };
            }
            if (kind === 'sell_items') {
                const count = weekly ? 25 : 6;
                return {
                    id: `sell_items_${count}`,
                    kind,
                    target: null,
                    count,
                    progress: 0,
                    rewardPoints: reward,
                    completed: false,
                    label: `Sell ${count} items`
                };
            }
            if (kind === 'earn_bells') {
                const count = weekly ? 5000 : 800;
                return {
                    id: `earn_bells_${count}`,
                    kind,
                    target: null,
                    count,
                    progress: 0,
                    rewardPoints: reward + (weekly ? 30 : 10),
                    completed: false,
                    label: `Earn ${count} Bells`
                };
            }
            if (kind === 'visit_biomes') {
                const count = weekly ? 10 : 3;
                return {
                    id: `visit_biomes_${count}`,
                    kind,
                    target: null,
                    count,
                    progress: 0,
                    rewardPoints: reward,
                    completed: false,
                    label: `Visit ${count} biomes`
                };
            }
            if (kind === 'complete_quest') {
                const count = weekly ? 4 : 1;
                return {
                    id: `complete_quest_${count}`,
                    kind,
                    target: null,
                    count,
                    progress: 0,
                    rewardPoints: reward + (weekly ? 40 : 15),
                    completed: false,
                    label: `Complete ${count} quest${count === 1 ? '' : 's'}`
                };
            }
            if (kind === 'sell_specialty') {
                const count = weekly ? 10 : 3;
                return {
                    id: `sell_specialty_${count}`,
                    kind,
                    target: null,
                    count,
                    progress: 0,
                    rewardPoints: reward + 10,
                    completed: false,
                    label: `Sell ${count} specialty items`
                };
            }
            return null;
        }

        function generateChallengeSet(seedKey, count, isWeekly) {
            const rng = seededRng(seedKey);
            const kinds = (isWeekly ? WEEKLY_KINDS : DAILY_KINDS).slice();
            const challenges = [];
            const used = new Set();
            let safety = 0;
            while (challenges.length < count && safety < 50) {
                safety++;
                const kind = pickFrom(kinds, rng);
                const ch = createChallenge(kind, rng, isWeekly);
                if (!ch || used.has(ch.id)) continue;
                used.add(ch.id);
                challenges.push(ch);
            }
            return challenges;
        }

        function defaultMeta() {
            const todayKey = getTodayKey();
            const weekKey = getWeekKey();
            return {
                version: 1,
                dailyKey: todayKey,
                weeklyKey: weekKey,
                dailyChallenges: generateChallengeSet(todayKey, 3, false),
                weeklyChallenges: generateChallengeSet(weekKey, 2, true),
                streak: { current: 0, best: 0, lastCompletedKey: '' },
                points: 0,
                featuredBiome: pickFrom(BIOME_KEYS, seededRng(`${todayKey}-biome`)),
                weeklyMutator: pickFrom(WEEKLY_MUTATORS, seededRng(`${weekKey}-mutator`)),
                stats: {
                    itemsCollected: 0,
                    animalsCollected: 0,
                    fishCaught: 0,
                    questsCompleted: 0,
                    bellsEarned: 0,
                    biomesVisited: 0,
                    daysPlayed: 1
                },
                unlockedAccessories: state.unlockedAccessories.slice(),
                rewardTier: 0,
                dailyVisitedBiomes: []
            };
        }

        function loadMeta() {
            try {
                const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (!raw) return defaultMeta();
                const parsed = JSON.parse(raw);
                if (!parsed || parsed.version !== 1) return defaultMeta();
                if (!parsed.stats) parsed.stats = defaultMeta().stats;
                if (!parsed.unlockedAccessories) parsed.unlockedAccessories = state.unlockedAccessories.slice();
                if (!parsed.dailyVisitedBiomes) parsed.dailyVisitedBiomes = [];
                return parsed;
            } catch (e) {
                console.warn('Failed to load meta', e);
                return defaultMeta();
            }
        }

        function saveMeta() {
            if (!state.meta) return;
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state.meta));
            } catch (e) {
                console.warn('Failed to save meta', e);
            }
        }

        function applyMetaToState(meta) {
            state.meta = meta;
            state.featuredBiome = meta.featuredBiome;
            state.weeklyMutator = meta.weeklyMutator;
            state.unlockedAccessories = Array.from(new Set([...(state.unlockedAccessories || []), ...(meta.unlockedAccessories || [])]));
            state.dailyBiomeSet = new Set(meta.dailyVisitedBiomes || []);
        }

        function ensureDailyWeekly() {
            const meta = state.meta || defaultMeta();
            const todayKey = getTodayKey();
            const weekKey = getWeekKey();
            if (meta.dailyKey !== todayKey) {
                const prevKey = meta.dailyKey;
                const prevCompleted = meta.streak.lastCompletedKey === prevKey;
                meta.streak.current = prevCompleted ? meta.streak.current + 1 : 0;
                meta.streak.best = Math.max(meta.streak.best, meta.streak.current);
                meta.dailyKey = todayKey;
                meta.dailyChallenges = generateChallengeSet(todayKey, 3, false);
                meta.featuredBiome = pickFrom(BIOME_KEYS, seededRng(`${todayKey}-biome`));
                meta.stats.daysPlayed += 1;
                meta.dailyVisitedBiomes = [];
            }
            if (meta.weeklyKey !== weekKey) {
                meta.weeklyKey = weekKey;
                meta.weeklyChallenges = generateChallengeSet(weekKey, 2, true);
                meta.weeklyMutator = pickFrom(WEEKLY_MUTATORS, seededRng(`${weekKey}-mutator`));
            }
            applyMetaToState(meta);
            saveMeta();
        }

        function checkRewardTiers() {
            const meta = state.meta;
            if (!meta) return;
            for (let i = meta.rewardTier; i < REWARD_TIERS.length; i++) {
                const tier = REWARD_TIERS[i];
                if (meta.points >= tier.points) {
                    const unlocks = Array.isArray(tier.unlock) ? tier.unlock : [tier.unlock];
                    unlocks.forEach(acc => {
                        if (!meta.unlockedAccessories.includes(acc)) meta.unlockedAccessories.push(acc);
                        if (!state.unlockedAccessories.includes(acc)) state.unlockedAccessories.push(acc);
                    });
                    meta.rewardTier = i + 1;
                    if (scene) {
                        createFloatingText(`Reward Unlocked!`, new THREE.Vector3(0, GLOBE_RADIUS + 5, 0), 0xf59e0b);
                    }
                    if (SFX.levelup) SFX.levelup();
                }
            }
        }

        function markDailyCompletionIfReady() {
            const meta = state.meta;
            if (!meta) return;
            const allDone = meta.dailyChallenges.length > 0 && meta.dailyChallenges.every(ch => ch.completed);
            if (allDone) {
                meta.streak.lastCompletedKey = meta.dailyKey;
            }
        }

        function updateChallengeProgress(list, kind, payload) {
            if (!list || list.length === 0) return;
            list.forEach(ch => {
                if (ch.completed || ch.kind !== kind) return;
                if (ch.target && payload && payload.target && ch.target !== payload.target) return;
                let inc = 1;
                if (payload && typeof payload.count === 'number') inc = payload.count;
                if (payload && typeof payload.amount === 'number') inc = payload.amount;
                ch.progress = Math.min(ch.count, ch.progress + inc);
                if (ch.progress >= ch.count && !ch.completed) {
                    ch.completed = true;
                    state.meta.points += ch.rewardPoints;
                    if (scene) {
                        createFloatingText(`+${ch.rewardPoints} pts`, new THREE.Vector3(0, GLOBE_RADIUS + 5, 0), 0x60a5fa);
                    }
                }
            });
        }

        function recordEvent(kind, payload = {}) {
            const meta = state.meta;
            if (!meta) return;
            if (kind === 'collect_item') meta.stats.itemsCollected += payload.count || 1;
            if (kind === 'collect_animal') meta.stats.animalsCollected += payload.count || 1;
            if (kind === 'fish_catch') meta.stats.fishCaught += payload.count || 1;
            if (kind === 'complete_quest') meta.stats.questsCompleted += payload.count || 1;
            if (kind === 'earn_bells') meta.stats.bellsEarned += payload.amount || 0;

            if (kind === 'visit_biomes') {
                const biomeKey = payload.biomeKey;
                if (biomeKey && !state.dailyBiomeSet.has(biomeKey)) {
                    state.dailyBiomeSet.add(biomeKey);
                    meta.dailyVisitedBiomes = Array.from(state.dailyBiomeSet);
                    meta.stats.biomesVisited += 1;
                    updateChallengeProgress(meta.dailyChallenges, kind, { count: 1 });
                    updateChallengeProgress(meta.weeklyChallenges, kind, { count: 1 });
                }
            } else {
                updateChallengeProgress(meta.dailyChallenges, kind, payload);
                updateChallengeProgress(meta.weeklyChallenges, kind, payload);
            }

            markDailyCompletionIfReady();
            checkRewardTiers();
            saveMeta();
            renderChallengeBoard();
        }

        function renderChallengeList(list) {
            if (!list || list.length === 0) return '<div class="text-sm text-gray-500">No challenges.</div>';
            return list.map(ch => {
                const pct = Math.min(100, Math.round((ch.progress / ch.count) * 100));
                return `
                    <div class="bg-white/60 border border-amber-200 rounded-xl p-3 mb-3">
                        <div class="flex items-center justify-between mb-2">
                            <div class="font-semibold text-amber-900">${ch.label}</div>
                            <div class="text-xs font-bold text-amber-700">${ch.rewardPoints} pts</div>
                        </div>
                        <div class="progress-track">
                            <div class="progress-fill" style="width:${pct}%"></div>
                        </div>
                        <div class="text-xs text-amber-700 mt-1">${ch.progress}/${ch.count} ${ch.completed ? '✅' : ''}</div>
                    </div>
                `;
            }).join('');
        }

        function renderRewards() {
            const meta = state.meta;
            if (!meta) return '';
            return REWARD_TIERS.map((tier, idx) => {
                const unlocked = meta.rewardTier > idx;
                return `
                    <div class="flex items-center justify-between bg-white/60 border border-amber-200 rounded-xl p-3 mb-3">
                        <div>
                            <div class="font-semibold text-amber-900">Tier ${idx + 1} • ${tier.points} pts</div>
                            <div class="text-xs text-amber-700">${tier.label}</div>
                        </div>
                        <div class="text-sm font-bold ${unlocked ? 'text-green-600' : 'text-gray-500'}">${unlocked ? 'Unlocked' : 'Locked'}</div>
                    </div>
                `;
            }).join('');
        }

        function renderStats() {
            const s = state.meta?.stats;
            if (!s) return '';
            return `
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white/60 border border-amber-200 rounded-xl p-3">Items Collected: <b>${s.itemsCollected}</b></div>
                    <div class="bg-white/60 border border-amber-200 rounded-xl p-3">Animals Collected: <b>${s.animalsCollected}</b></div>
                    <div class="bg-white/60 border border-amber-200 rounded-xl p-3">Fish Caught: <b>${s.fishCaught}</b></div>
                    <div class="bg-white/60 border border-amber-200 rounded-xl p-3">Quests Completed: <b>${s.questsCompleted}</b></div>
                    <div class="bg-white/60 border border-amber-200 rounded-xl p-3">Bells Earned: <b>${s.bellsEarned}</b></div>
                    <div class="bg-white/60 border border-amber-200 rounded-xl p-3">Biomes Visited: <b>${s.biomesVisited}</b></div>
                    <div class="bg-white/60 border border-amber-200 rounded-xl p-3">Days Played: <b>${s.daysPlayed}</b></div>
                    <div class="bg-white/60 border border-amber-200 rounded-xl p-3">Streak Best: <b>${state.meta.streak.best}</b></div>
                </div>
            `;
        }

        function renderChallengeBoard(activeTab = 'daily') {
            const modal = document.getElementById('challenge-board-modal');
            if (!modal || modal.classList.contains('hidden')) return;
            const content = document.getElementById('challenge-board-content');
            const badges = document.getElementById('challenge-badges');
            if (!content || !badges || !state.meta) return;
            badges.innerHTML = `
                <span class="badge">⭐ Featured Biome: ${state.featuredBiome}</span>
                <span class="badge">🗓️ Weekly Mutator: ${state.weeklyMutator.replace(/_/g, ' ')}</span>
                <span class="badge">🔥 Streak: ${state.meta.streak.current}</span>
                <span class="badge">✨ Points: ${state.meta.points}</span>
                <span class="badge">Resets at local midnight</span>
            `;
            if (activeTab === 'daily') content.innerHTML = renderChallengeList(state.meta.dailyChallenges);
            if (activeTab === 'weekly') content.innerHTML = renderChallengeList(state.meta.weeklyChallenges);
            if (activeTab === 'rewards') content.innerHTML = renderRewards();
            if (activeTab === 'stats') content.innerHTML = renderStats();
        }

        function init() {
            state.meta = loadMeta();
            ensureDailyWeekly();
            setupCustomization();
            setupChallengeUI();
            setInterval(saveMeta, 30000);
            
            // Load sound assets early
            if (audioContext && audioContextReady) {
                loadSoundAssets().catch(e => console.warn('Sound asset loading failed:', e));
            }
            
            // Wait for game start button
            const checkGameStart = setInterval(() => {
                if (!state.gameStarted) return;
                clearInterval(checkGameStart);
                initializeGame();
            }, 100);
        }
        
        function initializeGame() {
            scene = new THREE.Scene();
            skyCanvas = document.createElement('canvas');
            skyCanvas.width = 128; skyCanvas.height = 512;
            skyCtx = skyCanvas.getContext('2d');
            skyTexture = new THREE.CanvasTexture(skyCanvas);
            scene.background = skyTexture;

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 14);
            camera.lookAt(0, 2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.toneMappingExposure = 1.2; // slight exposure boost for glow effect
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            sunOrbit = new THREE.Group();
            scene.add(sunOrbit);

            sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(0, GLOBE_RADIUS + 55, 0);
            sun.castShadow = true;
            sunOrbit.add(sun);

            const sunSphere = new THREE.Mesh(
                new THREE.SphereGeometry(4, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xffdd00 })
            );
            sunSphere.position.copy(sun.position);
            sunOrbit.add(sunSphere);

            moon = new THREE.Group();
            const moonMesh = new THREE.Mesh(
                new THREE.SphereGeometry(3, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xeeeeee })
            );
            moon.add(moonMesh);
            moon.position.set(0, -(GLOBE_RADIUS + 55), 0);
            sunOrbit.add(moon);
            moon.mesh = moonMesh;

            const flareCanvas = document.createElement('canvas');
            flareCanvas.width = 64; flareCanvas.height = 64;
            const flareCtx = flareCanvas.getContext('2d');
            const flareGrad = flareCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
            flareGrad.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
            flareGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            flareCtx.fillStyle = flareGrad; flareCtx.fillRect(0,0,64,64);
            lensFlare = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(flareCanvas), blending: THREE.AdditiveBlending, transparent: true }));
            lensFlare.scale.set(12, 12, 1);
            scene.add(lensFlare);

            const rainbowGeo = new THREE.TorusGeometry(38, 0.8, 8, 48, Math.PI);
            const rainbowMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, vertexColors: true });
            const colors = [];
            for(let i=0; i<rainbowGeo.attributes.position.count; i++) {
                const c = new THREE.Color().setHSL(i/rainbowGeo.attributes.position.count, 0.8, 0.5);
                colors.push(c.r, c.g, c.b);
            }
            rainbowGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            rainbow = new THREE.Mesh(rainbowGeo, rainbowMat);
            rainbow.position.set(0, -10, -40);
            scene.add(rainbow);

            createStars();
            createWeatherSystems();
            createGlobe();
            createPlayer();
            setupControls();
            updateInventoryUI();

            clock = new THREE.Clock();
            animate();
            
            setInterval(changeWeather, 60000); 
            setInterval(rollSkyMode, 120000);
            document.getElementById('sell-all-btn').onclick = sellAll;
            document.getElementById('close-shop-btn').onclick = closeShop;
            document.getElementById('fish-cast-btn').onclick = castFishingLine;
            document.getElementById('fishing-close-btn').onclick = closeFishing;
        }

        function rollSkyMode() {
            const roll = Math.random();
            if (roll < 0.1) state.skyMode = 'rare-pink';
            else if (roll < 0.2) state.skyMode = 'rare-purple';
            else state.skyMode = 'default';
        }

        function createStars() {
            const starGeo = new THREE.BufferGeometry();
            const starPos = [];
            for(let i=0; i<1500; i++) starPos.push((Math.random()-0.5)*800, (Math.random()-0.5)*800, (Math.random()-0.5)*800);
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
            stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 }));
            scene.add(stars);
        }

        function createWeatherSystems() {
            const rainGeo = new THREE.BufferGeometry();
            const rainPos = [];
            for(let i=0; i<800; i++) rainPos.push((Math.random()-0.5)*60, Math.random()*30, (Math.random()-0.5)*60);
            rainGeo.setAttribute('position', new THREE.Float32BufferAttribute(rainPos, 3));
            const rainMat = new THREE.PointsMaterial({ color: 0xaaaaFF, size: 0.1, transparent: true, opacity: 0 });
            weatherParticles = new THREE.Points(rainGeo, rainMat);
            scene.add(weatherParticles);
        }

        function createGlobe() {
            const geometry = new THREE.SphereGeometry(GLOBE_RADIUS, 64, 64);
            const material = new THREE.MeshStandardMaterial({ color: 0x7cfc00 });
            globe = new THREE.Mesh(geometry, material);
            globe.receiveShadow = true;
            globe.position.y = -GLOBE_RADIUS;
            scene.add(globe);

            for(let i=0; i<200; i++) spawnProceduralEntity(null, null, true);
        }

        function createPlayer() {
            player = new THREE.Group();
            
            // Lower body (pants/dress/shorts)
            const lowerGeo = new THREE.CylinderGeometry(0.3, 0.25, 0.8, 8);
            const lowerMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
            const lower = new THREE.Mesh(lowerGeo, lowerMat);
            lower.position.y = 0.1;
            lower.castShadow = true;
            player.add(lower);
            
            // Torso (shirt/body)
            const torsoGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.9, 8);
            const torsoMat = new THREE.MeshStandardMaterial({ color: 0x3498db });
            const torso = new THREE.Mesh(torsoGeo, torsoMat);
            torso.position.y = 0.95;
            torso.castShadow = true;
            player.add(torso);
            
            // Head
            let headGeo;
            if (state.headShape === 'head_round' || state.headShape === 'sphere') {
                headGeo = new THREE.SphereGeometry(0.35, 12, 12);
            } else if (state.headShape === 'head_square' || state.headShape === 'box') {
                headGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
            } else {
                headGeo = new THREE.ConeGeometry(0.35, 0.6, 8);
            }
            const headMat = new THREE.MeshStandardMaterial({ color: state.skinColor });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.7;
            head.castShadow = true;
            player.add(head);
            
            // Hair (colored shape)
            const hairGeo = new THREE.SphereGeometry(0.38, 12, 12);
            const hairMat = new THREE.MeshStandardMaterial({ color: state.hairColor });
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.y = 1.9;
            hair.castShadow = true;
            player.add(hair);
            
            // Eyes
            const eyeGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            
            if (state.eyesStyle === 'eyes_normal') {
                leftEye.position.set(-0.12, 0.15, 0.3);
                rightEye.position.set(0.12, 0.15, 0.3);
            } else if (state.eyesStyle === 'eyes_happy') {
                leftEye.position.set(-0.12, 0.1, 0.3);
                rightEye.position.set(0.12, 0.1, 0.3);
                leftEye.scale.set(1.2, 0.7, 1);
                rightEye.scale.set(1.2, 0.7, 1);
            } else if (state.eyesStyle === 'eyes_sleepy') {
                leftEye.position.set(-0.12, 0.15, 0.3);

                leftEye.scale.set(1.3, 1.3, 1);
                rightEye.scale.set(1.3, 1.3, 1);
            }
            player.add(leftEye, rightEye);
            
            // Hat accessory
            if (state.selectedAccessory && state.selectedAccessory !== 'none') {
                let hatGeo;
                let hatColor = ACCESSORIES_CATALOG[state.selectedAccessory]?.color || 0x111827;
                if (state.selectedAccessory.includes('tophat')) {

                }
                const hatMat = new THREE.MeshStandardMaterial({ color: hatColor });
                const hat = new THREE.Mesh(hatGeo, hatMat);
                hat.position.y = 2.1;
                hat.castShadow = true;
                player.add(hat);
            }
            
            // Carry item
            if (state.selectedCarry && state.selectedCarry !== 'none') {
                if (state.selectedCarry.includes('umbrella')) {

                    const umbrellaColor = ACCESSORIES_CATALOG[state.selectedCarry]?.color || (state.selectedCarry.includes('red') ? 0xdc2626 : 0x3b82f6);
                    const umbrellaMat = new THREE.MeshStandardMaterial({ color: umbrellaColor });

                } else if (state.selectedCarry.includes('backpack')) {

                    backpack.castShadow = true;
                    player.add(backpack);
                }
            }
            
            scene.add(player);
        }

        function getBiomeAt(phi, theta) {
            const slice = (theta + Math.PI) / (Math.PI * 2);
            if (slice < 0.15) return 'SAFARI';
            if (slice < 0.35) return 'SNOW';
            if (slice < 0.6) return 'GRASSLAND';
            if (slice < 0.85) return 'DESERT';
            return 'GRASSLAND';
        }

        function isWaterAt(phi, theta) {
            const targetTheta = Math.sin(phi * 3) * 0.4 + 1.2;
            return Math.abs(theta - targetTheta) < 0.25;
        }

        function isPositionOccupied(newPos, checkEntities, type, phi, theta) {
            const playerCenter = new THREE.Vector3(0, GLOBE_RADIUS, 0);
            const safetyZone = (type === 'house' || type === 'shop' || type === 'bridge') ? 45 : PLAYER_SAFETY_ZONE;
            if (newPos.distanceTo(playerCenter) < safetyZone) return true;
            if (isWaterAt(phi, theta) && !['bridge', 'fish', 'crab'].includes(type)) return true;
            for (let ent of checkEntities) {
                if (['cloud', 'bird'].includes(ent.type)) continue; 
                const entPos = new THREE.Vector3(); ent.mesh.getWorldPosition(entPos);
                if (newPos.distanceTo(entPos) < SPAWN_MARGIN) return true;
            }
            return false;
        }

        function spawnProceduralEntity(lat = null, lon = null, isInitial = false) {
            // Skip spawn if entity cap is reached (unless initial setup)
            if (!isInitial && entities.length >= MAX_ENTITIES) return;
            let phi = lat !== null ? lat : Math.random() * Math.PI;
            let theta = lon !== null ? lon : (Math.random() * Math.PI * 2 - Math.PI);
            const biomeKey = getBiomeAt(phi, theta);
            const inWater = isWaterAt(phi, theta);
            const typeRoll = Math.random();
            let type = 'tree';
            const wildlifeBoost = state.weeklyMutator === 'WILDLIFE_BOOM' ? 0.08 : 0;
            const fishBoost = state.weeklyMutator === 'RAINY_WEEK' ? 0.10 : 0;
            const coinChance = state.weeklyMutator === 'COIN_RUSH' ? 0.03 : 0;

            if (inWater) {
                const fishChance = 0.35 + fishBoost;
                const crabChance = 0.55 + fishBoost;
                if (typeRoll < 0.08) type = 'bridge';
                else if (typeRoll < fishChance) type = 'fish';
                else if (typeRoll < crabChance) type = 'crab';
                else return;
            } else {
                if (typeRoll < 0.12) type = 'cloud';
                else if (typeRoll < 0.16) type = 'bird';
                else if (typeRoll < 0.20) type = 'house';
                else if (typeRoll < 0.22) type = 'shop';
                else if (coinChance > 0 && typeRoll < 0.22 + coinChance) type = 'coin';
                else {
                    if (biomeKey === 'SNOW') {
                        const snowPenguin = Math.min(0.4 + wildlifeBoost, 0.9);
                        const snowBear = Math.min(0.7 + wildlifeBoost, 0.95);
                        if (typeRoll < snowPenguin) type = 'penguin';
                        else if (typeRoll < snowBear) type = 'polarbear';
                        else type = 'ice_patch';
                    } else if (biomeKey === 'DESERT') {
                        const cactusThreshold = Math.max(0.7 - wildlifeBoost, 0.4);
                        if (typeRoll < cactusThreshold) type = 'cactus';
                        else type = 'camel';
                    } else if (biomeKey === 'SAFARI') {
                        const safariZebra = Math.min(0.4 + wildlifeBoost, 0.85);
                        const safariGiraffe = Math.min(0.7 + wildlifeBoost, 0.95);
                        if (typeRoll < safariZebra) type = 'zebra';
                        else if (typeRoll < safariGiraffe) type = 'giraffe';
                        else type = 'elephant';
                    } else {
                        if (typeRoll < 0.34) type = 'tree';
                        else if (typeRoll < 0.52) type = 'flower';
                        else if (typeRoll < 0.66) type = 'butterfly';
                        else if (typeRoll < 0.76) type = 'ladybug';
                        else if (typeRoll < 0.86) type = 'firefly';
                        else if (typeRoll < 0.92) type = 'bush';
                        else if (typeRoll < Math.min(0.955 + wildlifeBoost, 0.98)) type = 'redpanda';
                        else if (typeRoll < Math.min(0.98 + wildlifeBoost, 0.995)) type = 'fox';
                        else type = 'ostrich';
                    }
                }
            }

            let pos = new THREE.Vector3().setFromSphericalCoords(GLOBE_RADIUS, phi, theta);

            group.position.copy(new THREE.Vector3().setFromSphericalCoords(altitude, phi, theta));
            const normal = group.position.clone().normalize();
            group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);

            globe.add(group);
            entity.mesh = group;
            entities.push(entity);
        }

        function setupControls() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            const updateJoystick = (e) => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const touch = e.touches ? e.touches[0] : e;
                const rect = zone.getBoundingClientRect();
                const center = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
                let dx = touch.clientX - center.x;
                let dy = touch.clientY - center.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const max = rect.width / 2;
                if (dist > max) { dx *= max/dist; dy *= max/dist; }
                joystick.dx = dx/max; joystick.dy = dy/max;
                knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            };
            zone.addEventListener('pointerdown', (e) => { joystick.active = true; updateJoystick(e); });
            window.addEventListener('pointermove', (e) => { if(joystick.active) updateJoystick(e); });
            window.addEventListener('pointerup', () => { joystick.active = false; joystick.dx = 0; joystick.dy = 0; knob.style.transform = `translate(-50%, -50%)`; });
            
            // Mobile-first: fishing is opened via on-screen button
        }
